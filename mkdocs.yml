site_name: Ad Infinitum documentation
site_description: Server rules, class changes, and customizations for Ad Infinitum.
site_url: https://astr1dx.github.io/ROProjectDoc/
edit_uri: https://github.com/astr1dx/ROProjectDoc/edit/main/docs/
exclude_docs: |
  client-patches.md
  editing.md
hooks:
  - hooks/publishing.py
validation:
  links:
    anchors: warn

theme:
  name: material
  language: en
  icon:
    logo: material/compass-rose
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

nav:
  - Welcome:
      - Home: index.md
      - Server Information: server-rules.md
      - All Pages (A-Z): all-pages.md
  - Getting Started:
      - How to Start: getting-started.md
      - Find Your Class: classes.md
      - Player Tools:
          - Personal Settings: personal-settings.md
          - Advanced Autoloot: autoloot.md
          - Fast Storage: fast-storage.md
          - Kill Count: kill-count.md
  - Features & Enhancements:
      - Overview: features.md
      - Features:
          - Vendor System: vendor-system.md
      - Changes:
          - Class Changes: class-changes.md
          - Quest Changes: quest-changes.md
          - Quality of Life: quality-of-life.md
      - Enhancements:
          - Attendance Rewards: attendance.md
          - Hourly Rewards: hourly-rewards.md
          - Convenient Dealers: dealers.md
          - Card Drop Announcements: card-drop-announcements.md
          - Card Exchange: card-exchange.md
  - Dungeons & Instances:
      - Hunting and Instance Guide: dungeons.md
  - Events & Activities:
      - Rewards and Activities: events.md
  - Patch Notes:
      - Latest Updates: updates.md
      - "2026":
          - November 10: updates/2026-11-10.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - fenced_code
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css
