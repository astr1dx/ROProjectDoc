site_name: Ad Infinitum documentation
site_description: Server rules, class changes, and customizations for Ad Infinitum.
site_url: https://astr1dx.github.io/ROProjectDoc/
edit_uri: https://github.com/astr1dx/ROProjectDoc/edit/main/docs/
exclude_docs: |
  client-patches.md
  editing.md
hooks:
  - hooks/publishing.py
validation:
  links:
    anchors: warn

theme:
  name: material
  language: en
  icon:
    logo: material/compass-rose
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

nav:
  - Home: index.md
  - Server Rules: server-rules.md
  - Find Your Class: classes.md
  - Class Changes: class-changes.md
  - Quality of Life: quality-of-life.md
  - Attendance Rewards: attendance.md
  - Hourly Rewards: hourly-rewards.md
  - Convenient Dealers: dealers.md
  - Card Exchange: card-exchange.md
  - Vendor System: vendor-system.md
  - Quest Changes: quest-changes.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - fenced_code
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css
